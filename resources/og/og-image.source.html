*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:2400px;height:1260px;}
.card{position:relative;width:2400px;height:1260px;overflow:hidden;
  font-family:'Tj',sans-serif;
  background:
    radial-gradient(1200px 620px at 50% -8%, rgba(35,140,86,.14), rgba(35,140,86,0) 60%),
    linear-gradient(180deg,#f3f8f2 0%,#eef4ec 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;}
.logo{width:230px;height:230px;border-radius:44px;background:#fff;
  box-shadow:0 30px 70px rgba(20,60,40,.13),0 4px 14px rgba(20,60,40,.06);
  display:flex;align-items:center;justify-content:center;margin-bottom:64px;}
.logo img{width:168px;height:auto;}
h1{font-weight:800;font-size:250px;line-height:.95;color:#122019;
  letter-spacing:-2px;margin-bottom:44px;}
.badge{font-weight:700;font-size:64px;color:#2b9d5b;background:#e5f2e9;
  padding:16px 58px;border-radius:999px;margin-bottom:70px;}
.sub{font-weight:500;font-size:64px;color:#6a7b72;margin-bottom:80px;}
.feats{display:flex;flex-direction:row;gap:38px;}
.pill{display:flex;flex-direction:row;align-items:center;gap:18px;
  background:#fff;border-radius:30px;padding:28px 50px;
  font-weight:700;font-size:54px;color:#1e3529;
  box-shadow:0 14px 34px rgba(20,60,40,.09),0 2px 8px rgba(20,60,40,.05);}
.pill svg{width:54px;height:54px;stroke:#16a34a;stroke-width:2.1;
  fill:none;stroke-linecap:round;stroke-linejoin:round;}
.bar{position:absolute;left:0;right:0;bottom:0;height:22px;
  background:linear-gradient(90deg,#2f9e5f 0%,#2f9e5f 62%,#8f9a3f 82%,#c6a231 100%);}
</style></head>
